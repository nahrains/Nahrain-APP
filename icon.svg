<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2d42"/>
      <stop offset="100%" stop-color="#2F4156"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#567C8D"/>
      <stop offset="100%" stop-color="#3d5c6e"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8D9E6"/>
      <stop offset="100%" stop-color="#9ab8c9"/>
    </linearGradient>
    <linearGradient id="crown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dceaf3"/>
      <stop offset="100%" stop-color="#C8D9E6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ══ BACKGROUND ══ -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Ambient glow behind cap -->
  <circle cx="256" cy="210" r="170" fill="rgba(86,124,141,0.14)"/>

  <!-- Corner accent circles -->
  <circle cx="450" cy="62"  r="95"  fill="rgba(200,217,230,0.06)"/>
  <circle cx="62"  cy="450" r="75"  fill="rgba(86,124,141,0.07)"/>

  <!-- ══ GRADUATION CAP ══ -->

  <!-- Cap crown (cylinder body) -->
  <rect x="226" y="110" width="60" height="58" rx="10" fill="url(#crown)"/>
  <!-- Crown top face (ellipse) -->
  <ellipse cx="256" cy="110" rx="30" ry="9" fill="#edf4f9"/>
  <!-- Crown bottom rim -->
  <ellipse cx="256" cy="168" rx="30" ry="9" fill="#afc9d8"/>
  <!-- Crown button -->
  <circle cx="256" cy="103" r="9" fill="#567C8D"/>
  <circle cx="256" cy="103" r="4" fill="#3d5c6e"/>

  <!-- Board (flat diamond) -->
  <polygon points="256,185 408,248 256,311 104,248" fill="#FFFFFF" filter="url(#glow)"/>
  <!-- Board top face highlight (3D effect) -->
  <polygon points="256,168 408,231 256,248 104,231" fill="#f0f6fa"/>
  <!-- Board right face shadow -->
  <polygon points="408,231 408,248 256,311 256,294" fill="rgba(47,65,86,0.18)"/>
  <!-- Board top-right bevel highlight -->
  <polygon points="256,168 408,231 408,248 256,185" fill="rgba(200,217,230,0.55)"/>

  <!-- ══ TASSEL ══ -->
  <!-- Knob at right corner -->
  <circle cx="408" cy="248" r="12" fill="rgba(255,255,255,0.88)"/>
  <!-- Cord hanging down -->
  <path d="M408,260 Q412,280 408,302" stroke="rgba(255,255,255,0.82)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Tassel wrap band -->
  <rect x="399" y="298" width="18" height="8" rx="4" fill="rgba(200,217,230,0.9)"/>
  <!-- Tassel threads -->
  <line x1="401" y1="306" x2="390" y2="336" stroke="rgba(255,255,255,0.78)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="406" y1="306" x2="404" y2="338" stroke="rgba(255,255,255,0.78)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="411" y1="306" x2="418" y2="336" stroke="rgba(255,255,255,0.78)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- ══ TWO RIVERS (النهرين) ══ -->
  <!-- River 1 — Teal -->
  <path d="M 76,372 C 128,345 168,399 220,372 C 272,345 312,399 364,372 C 390,358 416,363 436,368"
        fill="none" stroke="url(#wave1)" stroke-width="15" stroke-linecap="round"/>
  <!-- River 2 — Sky Blue (offset, narrower) -->
  <path d="M 76,412 C 128,385 168,439 220,412 C 272,385 312,439 364,412 C 390,398 416,403 436,408"
        fill="none" stroke="url(#wave2)" stroke-width="11" stroke-linecap="round" opacity="0.85"/>

  <!-- ══ SPARKLES ══ -->
  <!-- Star top-left -->
  <g transform="translate(120,158)" opacity="0.75">
    <line x1="0" y1="-11" x2="0" y2="11"  stroke="#C8D9E6" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-11" y1="0" x2="11" y2="0"  stroke="#C8D9E6" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-7" y1="-7" x2="7" y2="7"   stroke="#C8D9E6" stroke-width="2"   stroke-linecap="round"/>
    <line x1="7" y1="-7" x2="-7" y2="7"   stroke="#C8D9E6" stroke-width="2"   stroke-linecap="round"/>
  </g>
  <!-- Small star top-right -->
  <g transform="translate(388,128)" opacity="0.6">
    <line x1="0" y1="-8" x2="0" y2="8"  stroke="#F5EFEB" stroke-width="3" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="8" y2="0"  stroke="#F5EFEB" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Tiny dot accents -->
  <circle cx="148" cy="316" r="6" fill="#567C8D" opacity="0.65"/>
  <circle cx="364" cy="316" r="5" fill="#C8D9E6" opacity="0.6"/>
  <circle cx="448" cy="200" r="5" fill="#F5EFEB" opacity="0.4"/>
  <circle cx="64"  cy="200" r="4" fill="#C8D9E6" opacity="0.4"/>
</svg>
